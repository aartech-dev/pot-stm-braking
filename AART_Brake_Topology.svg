<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 640" role="img">
<title>AART brake module — circuit topology Rev 11</title>
<desc>Three rails: WHITE (+12-16V) top, BLACK (controller/track) middle, RED (0V) bottom. On BLACK, a two N-channel common-source bidirectional switch (Q5/Q6) driven by the TPS1212-Q1 (U5) from the WHITE rail is the low-loss reverse-blocking pass element between controller-in and track-out. The TPS1212-Q1 (VS from WHITE) drives the pair, senses current via RSNS, and pulls its gate off on reverse (I_DIR, ~6-10us) or on overcurrent (I2t/SCP). Slower than a 0.75us ideal-diode controller but adds protection. 3.3V LDO and 5V LDO (U4) from WHITE. MCU STM32G051 provides DAC1 (brake) and a 50kHz PWM (anti-brake demand). Brake stage block: Q2 IRFP250N wide-SOA N-channel low-side FET, gate from DAC1 via op-amp buffer GD2, shunts BLACK-to-track to RED; heatsink. Anti-brake current-source block: a 50kHz PWM demand (filtered to DC) drives op-amp GD1 powered from the WHITE rail (~16V; it senses near the rail, so a 5V op-amp cannot be used); GD1 regulates Q1 TIP147 to a constant current set by Rsense (0.1 ohm) in the WHITE leg; injection through D4 into BLACK-to-track; heatsink. Bounded ~3A at stall. The floating-supply P-channel scheme is removed.</desc>
