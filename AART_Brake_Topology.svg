<rect class="box-gray" x="28" y="572" width="624" height="46" rx="5"/>
<text class="ts" x="40" y="589" text-anchor="start">Anti-brake = constant-current source: GD1 (HV op-amp powered from WHITE, not +5V) regulates I = Vdemand/Rsense (0.1 ohm). PWM demand 0 = off, full = 3A. Bounded ~3A at stall.</text>
<text class="ts" x="40" y="606" text-anchor="start">Brake Q2 (IRFP250N) is resistance-controlled linear (~12W peak). Anti-brake pass device ~47W transient at stall. Both need heatsinks (sized by burst energy).</text>
