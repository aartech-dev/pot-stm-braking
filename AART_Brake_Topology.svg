<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 640" role="img">
<title>AART brake module — circuit topology Rev 11</title>
<desc>Three horizontal rails WHITE, BLACK, RED. D1 LTC4412 pass gate on BLACK. Q1 P-channel high-side FET driven by GD1 LM321 with floating supply (ZD1 BZX84C15 15V zener, R_Z1 10k, C_Z1 100nF referenced to WHITE rail). Q2 N-channel low-side brake FET driven by GD2 op-amp from 3.3V. MCU STM32G051 with DAC1/DAC2. LDO from WHITE. Controller side left, track and motor right.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-float" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: Arial, sans-serif; }
    .ts  { font-size: 11px; fill: #444; }
    .th  { font-size: 12px; font-weight: 600; fill: #222; }
    .box-gray   { fill: #F1EFE8; stroke: #888; stroke-width: 0.5; }
    .box-amber  { fill: #FFF3DC; stroke: #BA7517; stroke-width: 0.5; }
    .box-purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
    .box-teal   { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
    .box-coral  { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
    .box-float  { fill: #FEF0E0; stroke: #854F0B; stroke-width: 0.75; }
    .rail  { stroke: #bbb; stroke-width: 1; stroke-dasharray: 6 3; }
    .power { stroke: #333; stroke-width: 2; fill: none; }
    .sense { stroke: #777; stroke-width: 0.75; stroke-dasharray: 3 2; fill: none; }
    .gate  { stroke: #555; stroke-width: 1; fill: none; }
    .float { stroke: #854F0B; stroke-width: 1.2; stroke-dasharray: 4 2; fill: none; }
  </style>
</defs>

<!-- ═══ RAILS ═══════════════════════════════════════════════ -->
<line class="rail" x1="90" y1="56" x2="590" y2="56"/>
<line class="rail" x1="90" y1="300" x2="590" y2="300"/>
<line class="rail" x1="90" y1="520" x2="590" y2="520"/>

<!-- Rail labels left -->
<rect class="box-gray" x="28" y="40" width="62" height="32" rx="5"/>
<text class="ts" x="59" y="53" text-anchor="middle">WHITE</text>
<text class="ts" x="59" y="66" text-anchor="middle">+12–16V</text>

<rect class="box-gray" x="28" y="284" width="62" height="32" rx="5"/>
<text class="ts" x="59" y="297" text-anchor="middle">BLACK</text>
<text class="ts" x="59" y="310" text-anchor="middle">ctrl in</text>

<rect class="box-gray" x="28" y="504" width="62" height="32" rx="5"/>
<text class="ts" x="59" y="517" text-anchor="middle">RED</text>
<text class="ts" x="59" y="530" text-anchor="middle">0V</text>

<!-- Rail labels right -->
<rect class="box-gray" x="590" y="40" width="62" height="32" rx="5"/>
<text class="ts" x="621" y="53" text-anchor="middle">WHITE</text>
<text class="ts" x="621" y="66" text-anchor="middle">+12–16V</text>

<rect class="box-gray" x="590" y="284" width="62" height="32" rx="5"/>
<text class="ts" x="621" y="297" text-anchor="middle">BLACK</text>
<text class="ts" x="621" y="310" text-anchor="middle">track out</text>

<rect class="box-gray" x="590" y="504" width="62" height="32" rx="5"/>
<text class="ts" x="621" y="517" text-anchor="middle">RED</text>
<text class="ts" x="621" y="530" text-anchor="middle">0V</text>

<!-- ═══ D1 PASS GATE on BLACK ════════════════════════════════ -->
<line class="power" x1="166" y1="300" x2="200" y2="300" marker-end="url(#arrow)"/>
<rect class="box-amber" x="200" y="280" width="104" height="40" rx="8"/>
<text class="th" x="252" y="296" text-anchor="middle">D1 pass gate</text>
<text class="ts" x="252" y="311" text-anchor="middle">LTC4412</text>
<line class="power" x1="304" y1="300" x2="354" y2="300" marker-end="url(#arrow)"/>

<!-- BLACK_to_track junction -->
<circle cx="376" cy="300" r="6" fill="#333"/>
<text class="th" x="376" y="270" text-anchor="middle">BLACK_to_track</text>
<text class="ts" x="376" y="285" text-anchor="middle" style="font-size:10px;fill:#888">R10/R11 sense here</text>
<line class="power" x1="383" y1="300" x2="590" y2="300" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- ═══ LDO ════════════════════════════════════════════════ -->
<line class="power" x1="230" y1="56" x2="230" y2="82" marker-end="url(#arrow)"/>
<text class="ts" x="242" y="74" style="font-size:10px;fill:#888">F1 fuse</text>
<rect class="box-amber" x="186" y="82" width="104" height="44" rx="8"/>
<text class="th" x="238" y="100" text-anchor="middle">LDO 3.3V</text>
<text class="ts" x="238" y="116" text-anchor="middle">C_HU 100µF</text>
<line class="sense" x1="238" y1="126" x2="238" y2="150" marker-end="url(#arrow)"/>
<text class="ts" x="250" y="144" style="font-size:10px;fill:#888">3.3V</text>

<!-- ═══ POT + TOGGLE ═════════════════════════════════════ -->
<rect class="box-gray" x="90" y="150" width="96" height="52" rx="8"/>
<text class="th" x="138" y="170" text-anchor="middle">Pot +</text>
<text class="th" x="138" y="187" text-anchor="middle">toggle</text>
<line class="sense" x1="186" y1="176" x2="200" y2="176" marker-end="url(#arrow)"/>

<!-- ═══ MCU ══════════════════════════════════════════════ -->
<rect class="box-purple" x="200" y="150" width="104" height="72" rx="8"/>
<text class="th" x="252" y="170" text-anchor="middle">MCU</text>
<text class="ts" x="252" y="187" text-anchor="middle">STM32G051</text>
<text class="ts" x="252" y="204" text-anchor="middle">DAC1 + DAC2</text>

<!-- WHITE dV/dt sense -->
<line class="sense" x1="212" y1="56" x2="212" y2="150" marker-end="url(#arrow)"/>
<text class="ts" x="200" y="102" text-anchor="end" style="font-size:10px;fill:#888">dV/dt</text>

<!-- V_BLACK sense -->
<line class="sense" x1="376" y1="307" x2="376" y2="340"/>
<line class="sense" x1="376" y1="340" x2="264" y2="340"/>
<line class="sense" x1="264" y1="340" x2="264" y2="222" marker-end="url(#arrow)"/>
<text class="ts" x="320" y="354" text-anchor="middle" style="font-size:10px;fill:#888">V_BLACK sense</text>

<!-- ═══════════════════════════════════════════════════════════
     FLOATING SUPPLY CIRCUIT
     Column x=490, routed clear of Q1 box (starts at y=60)
     ═══════════════════════════════════════════════════════════ -->

<!-- Tap on WHITE at x=490 -->
<circle cx="490" cy="56" r="4" fill="#854F0B"/>
<!-- Down to R_Z1 -->
<line class="float" x1="490" y1="60" x2="490" y2="74"/>

<!-- R_Z1 body -->
<rect class="box-float" x="479" y="74" width="22" height="20" rx="3"/>
<text x="490" y="84" text-anchor="middle" style="font-size:9px;fill:#854F0B;font-weight:600">R_Z1</text>
<text x="490" y="94" text-anchor="middle" style="font-size:8px;fill:#854F0B">10kΩ</text>
<line class="float" x1="490" y1="94" x2="490" y2="108"/>

<!-- ZD1 zener: cathode bar at y=108, triangle tip (anode) at y=128 -->
<line x1="477" y1="108" x2="503" y2="108" stroke="#854F0B" stroke-width="1.8"/>
<line x1="477" y1="108" x2="472" y2="103" stroke="#854F0B" stroke-width="1.8"/>
<line x1="503" y1="108" x2="508" y2="113" stroke="#854F0B" stroke-width="1.8"/>
<polygon points="490,128 477,108 503,108" fill="none" stroke="#854F0B" stroke-width="1.8"/>
<text x="514" y="112" style="font-size:9px;fill:#854F0B;font-weight:600">ZD1 BZX84C15</text>
<text x="514" y="123" style="font-size:8px;fill:#854F0B">cathode → WHITE</text>
<text x="514" y="133" style="font-size:8px;fill:#854F0B">Vz = 15V</text>

<!-- Anode node (GD1 V+ supply point) at 490,128 -->
<circle cx="490" cy="128" r="3" fill="#854F0B"/>

<!-- C_Z1 cap to the right of anode node -->
<line class="float" x1="493" y1="128" x2="516" y2="128"/>
<line x1="516" y1="120" x2="516" y2="136" stroke="#854F0B" stroke-width="2.5"/>
<line x1="522" y1="120" x2="522" y2="136" stroke="#854F0B" stroke-width="2.5"/>
<line class="float" x1="522" y1="128" x2="540" y2="128"/>
<text x="544" y="125" style="font-size:9px;fill:#854F0B;font-weight:600">C_Z1 100nF</text>
<!-- Right plate of C_Z1 connects to GD1 V− node (stub) -->
<line class="float" x1="540" y1="128" x2="540" y2="148" style="stroke-dasharray:2 3"/>
<text x="544" y="148" style="font-size:8px;fill:#854F0B">V− (WHITE−15V)</text>

<!-- GD1 V+ wire: anode 490,128 → down to 490,170 → left to GD1 box right edge at 456,170 -->
<line class="float" x1="490" y1="131" x2="490" y2="170"/>
<line class="float" x1="490" y1="170" x2="456" y2="170" marker-end="url(#arrow-float)"/>
<text x="473" y="165" text-anchor="middle" style="font-size:9px;fill:#854F0B">V+ supply</text>

<!-- ═══ GD1 floating gate driver ═════════════════════════ -->
<rect class="box-amber" x="342" y="155" width="114" height="58" rx="8"/>
<text class="th" x="399" y="173" text-anchor="middle">GD1  LM321</text>
<text class="ts" x="399" y="189" text-anchor="middle">floating supply</text>
<text x="399" y="203" text-anchor="middle" style="font-size:9px;fill:#854F0B">V+ = WHITE · V− = WHITE−15V</text>
<!-- GD1 output → Q1 gate input -->
<line class="gate" x1="456" y1="184" x2="470" y2="184" marker-end="url(#arrow)"/>
<!-- DAC2 → GD1 input -->
<line class="sense" x1="304" y1="190" x2="342" y2="190" marker-end="url(#arrow)"/>
<text class="ts" x="322" y="185" text-anchor="middle" style="font-size:10px;fill:#888">DAC2</text>

<!-- ═══ Q1 P-ch (source tap on WHITE at x=468) ═══════════ -->
<circle cx="468" cy="56" r="3" fill="#333"/>
<line class="power" x1="468" y1="59" x2="468" y2="178" marker-end="url(#arrow)"/>
<rect class="box-teal" x="470" y="178" width="96" height="70" rx="8"/>
<text class="th" x="518" y="198" text-anchor="middle">Q1  P-ch</text>
<text class="ts" x="518" y="214" text-anchor="middle">KA / anti-brake</text>
<text class="ts" x="518" y="229" text-anchor="middle">high-side</text>
<!-- Q1 drain → BLACK_to_track -->
<line class="power" x1="518" y1="248" x2="518" y2="294" marker-end="url(#arrow)"/>

<!-- ═══ Q2 N-ch ═════════════════════════════════════════ -->
<!-- Q2 source from BLACK_to_track -->
<line class="power" x1="518" y1="300" x2="518" y2="370" marker-end="url(#arrow)"/>
<rect class="box-coral" x="470" y="370" width="96" height="70" rx="8"/>
<text class="th" x="518" y="390" text-anchor="middle">Q2  N-ch</text>
<text class="ts" x="518" y="406" text-anchor="middle">brake</text>
<text class="ts" x="518" y="421" text-anchor="middle">low-side</text>
<!-- Q2 drain → RED -->
<line class="power" x1="518" y1="440" x2="518" y2="520" marker-end="url(#arrow)"/>

<!-- ═══ GD2 3.3V gate driver ════════════════════════════ -->
<rect class="box-purple" x="352" y="376" width="108" height="44" rx="8"/>
<text class="th" x="406" y="393" text-anchor="middle">GD2  op-amp</text>
<text class="ts" x="406" y="409" text-anchor="middle">3.3V supply</text>
<line class="gate" x1="460" y1="398" x2="470" y2="398" marker-end="url(#arrow)"/>
<!-- DAC1 → GD2 -->
<line class="sense" x1="304" y1="205" x2="330" y2="205"/>
<line class="sense" x1="330" y1="205" x2="330" y2="398"/>
<line class="sense" x1="330" y1="398" x2="352" y2="398" marker-end="url(#arrow)"/>
<text class="ts" x="316" y="308" text-anchor="middle" style="font-size:10px;fill:#888">DAC1</text>

<!-- ═══ LEGEND ══════════════════════════════════════════ -->
<rect x="24" y="554" width="632" height="56" rx="6" fill="none" stroke="#ddd" stroke-width="0.5"/>
<line x1="40" y1="571" x2="76" y2="571" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="82" y="575">power / track</text>
<line x1="200" y1="571" x2="236" y2="571" stroke="#777" stroke-width="0.75" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<text class="ts" x="242" y="575">sense / DAC</text>
<line x1="348" y1="571" x2="384" y2="571" stroke="#854F0B" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arrow-float)"/>
<text class="ts" x="390" y="575" style="fill:#854F0B">GD1 floating supply</text>
<text class="ts" x="634" y="575" text-anchor="end" style="fill:#888">AART Rev 11</text>
<text x="340" y="598" text-anchor="middle" style="font-size:9px;fill:#888">GD1: V+ = WHITE, V− = WHITE−15V via ZD1 (BZX84C15 15V) + R_Z1 (10kΩ) + C_Z1 (100nF). DAC_KA_OFF=4095 → gate = WHITE → Vgs≈0 → Q1 off ✓</text>

</svg>
